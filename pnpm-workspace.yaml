packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: false

# One version of each shared dev tool across the workspace. Use "catalog:" in package.json.
catalog:
  '@eslint/js': ^9.39.0
  '@types/node': ^22.20.0
  eslint: ^9.39.0
  eslint-config-prettier: ^10.1.0
  globals: ^16.5.0
  prettier: ^3.6.0
  tsx: ^4.20.0
  turbo: ^2.6.0
  typescript: ~5.9.3
  typescript-eslint: ^8.46.0
  vitest: ^3.2.4
  zod: ^4.1.0
