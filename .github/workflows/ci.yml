name: CI

on:
  pull_request:
  push:
    branches: [main] # keeps main's status green; deploy.yml is manual-only (local demo, no VPS)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Test-only values. Real secrets never live in GitHub for the app (see docs/deploy.md).
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgresql://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= # 32 zero bytes, CI only
      INNGEST_DEV: '1'
      INNGEST_BASE_URL: http://localhost:8288
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The app scripts load ../../.env with dotenv-cli; job env wins over the (empty) example values.
      - run: cp .env.example .env

      - name: Migrate test database
        run: pnpm db:deploy

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build --cache-dir=.turbo/cache

      - name: Seed for e2e
        run: pnpm db:seed

      - name: Install Playwright (chromium)
        run: pnpm --filter @app/web exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm --filter @app/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  infra:
    name: infra (compose, Dockerfile, shell)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck -S warning -x infra/scripts/*.sh

      - name: compose config
        run: |
          printf 'DOMAIN=localhost\nPOSTGRES_PASSWORD=ci\nINNGEST_EVENT_KEY=ci\nINNGEST_SIGNING_KEY=abcd\n' > ci.env
          docker compose --env-file ci.env -f infra/compose.prod.yml config --quiet
        env:
          APP_ENV_FILE: ../ci.env

      - name: Caddyfile
        run: |
          docker run --rm -e DOMAIN=example.com -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - uses: docker/setup-buildx-action@v3

      - name: Build web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
